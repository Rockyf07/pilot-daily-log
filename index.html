<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Flight Log — REV & MX</title><style>
:root{color-scheme:dark;--bg:#101827;--card:#1a2739;--field:#101b2c;--text:#eef5ff;--muted:#9fb1c7;--border:#34435a;--accent:#71c5ff}body.light{color-scheme:light;--bg:#f3f6fa;--card:#fff;--field:#edf3f8;--text:#17283b;--muted:#5a6d81;--border:#d5dfea;--accent:#116ba9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding-bottom:100px}main{max-width:550px;margin:auto;padding:18px 14px 32px}h1{font-size:25px;margin:6px 0 2px;text-align:center;letter-spacing:.08em}h2{font-size:17px;margin:0 0 12px}p{color:var(--muted);font-size:13px}.sub{text-align:center;margin:0 0 20px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.row>*{min-width:0}.row.equal>*{flex:1}button,input,select{font:inherit;color:var(--text)}button{background:var(--field);border:1px solid var(--border);border-radius:9px;padding:10px 13px;cursor:pointer}button.primary{background:#1477b7;color:white;border-color:#1477b7;font-weight:700}button.danger{color:#ff9898}button:active{opacity:.7}input,select{width:100%;background:var(--field);border:1px solid var(--border);border-radius:9px;padding:11px 9px;min-height:44px}input:focus,select:focus{outline:2px solid var(--accent)}label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}.flighthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.flighthead strong{font-size:17px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meter{background:var(--field);border-radius:12px;padding:10px;border:1px solid var(--border)}.meter h3{font-size:12px;text-align:center;color:var(--muted);letter-spacing:.08em;margin:0 0 10px}.meter .time{font-size:19px;font-variant-numeric:tabular-nums;text-align:center;font-weight:700;color:var(--accent);padding:6px}.meter input{font-variant-numeric:tabular-nums;text-align:center;font-size:19px;font-weight:600;margin-bottom:8px}.section{margin-top:24px}.history-day{border-top:1px solid var(--border);padding:12px 0}.history-day summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:700}.small{font-size:12px;color:var(--muted)}.saved-flight{padding:10px 0;border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;background:var(--bg);border-top:1px solid var(--border);padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{width:min(30%,160px);font-weight:700}.toggle{display:flex;align-items:center;gap:10px}.toggle input{width:20px;min-height:20px}#notice{font-size:13px;color:var(--accent);text-align:center;min-height:18px}#history,#totals{scroll-margin-top:15px}#settings{display:none}body.show-settings #settings{display:block} .hidden{display:none!important}
</style></head><body><main><h1>FLIGHT LOG</h1><p class="sub">REV & MX · Offline capable</p><div class="row equal"><div class="card"><label for="date">DATE</label><input id="date" type="date"></div><div class="card"><label>AIRCRAFT</label><button id="manage" style="width:100%">Manage ±</button></div></div><div class="row"><h2>Daily Flights</h2><button id="settingsBtn">⚙ Settings</button></div><section class="card" id="settings"><h2>Settings</h2><label class="toggle"><input type="checkbox" id="fast"> Fast Decimal (12345 → 1234.5)</label><label class="toggle"><input type="checkbox" id="light"> Light theme</label><p>Speech dictation is normalized after iOS commits the final reading.</p><button id="export">Export backup JSON</button><button id="importBtn">Import backup JSON</button><input id="importFile" type="file" accept="application/json" class="hidden"></section><section id="flights"></section><div class="row"><button id="add" style="flex:1">+ Add Flight</button><button class="primary" id="save" style="flex:1">Save Day</button></div><p id="notice" role="status"></p><section id="history" class="section"><h2>Flight Log History</h2><div id="historyContent" class="card"></div></section><section id="totals" class="section"><h2>Totals</h2><div class="card"><div class="row equal"><div><label>FROM</label><input id="from" type="date"></div><div><label>TO</label><input id="to" type="date"></div></div><div id="totalsContent" style="margin-top:14px"></div></div></section></main><nav class="nav"><button data-go="top">Log</button><button data-go="history">History</button><button data-go="totals">Totals</button></nav><script>
(()=>{'use strict';const $=s=>document.querySelector(s),KEY='pilot-daily-log-standalone-v1',defaults=['15PS','62FM','261SP','3521T','537T','691BA','692BA','918BS'];const blank=()=>({aircraft:'',revStart:'',revFinish:'',mxStart:'',mxFinish:''});const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{aircraft:defaults,days:[],drafts:{},fast:false,light:false};state.aircraft||=defaults;state.days||=[];state.drafts||={};let date=today(),flights=[];const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=x=>Number.parseFloat(x)||0;const fmt=n=>Number(n||0).toFixed(1);const delta=(a,b)=>a!==''&&b!==''?Math.max(0,+(val(b)-val(a)).toFixed(1)):0;const notify=s=>{$('#notice').textContent=s;setTimeout(()=>{if($('#notice').textContent===s)$('#notice').textContent=''},4500)};const draft=()=>{state.drafts[date]=flights;persist()};function switchDate(d){draft();date=d;flights=(state.drafts[date]||[blank()]).map(f=>({...f}));$('#date').value=date;render()};function cleanVoice(v){v=String(v).trim().replace(/,/g,'').replace(/\s/g,'');if(/^\d+(?:\.\d+)?$/.test(v))return v;return v.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1')};function normalize(v){v=cleanVoice(v);if(!v)return '';if(state.fast&&!v.includes('.')&&v.length>1)return v.slice(0,-1)+'.'+v.slice(-1);return v};function dedupe(v,prior){const a=cleanVoice(v),b=cleanVoice(prior);if(!a||!b)return a; if(a===b+b)return b;if(a.startsWith(b)&&a.slice(b.length)===b)return b;const n=a.length;if(n%2===0&&a.slice(0,n/2)===a.slice(n/2))return a.slice(0,n/2);return a};function render(){const container=$('#flights');container.innerHTML=flights.map((f,i)=>`<article class="card"><div class="flighthead"><strong>Flight ${i+1}</strong>${flights.length>1?`<button class="danger" data-remove="${i}" aria-label="Remove flight">Remove</button>`:''}</div><label>AIRCRAFT</label><select data-i="${i}" data-field="aircraft"><option value="">Select aircraft</option>${state.aircraft.map(a=>`<option value="${escape(a)}" ${f.aircraft===a?'selected':''}>${escape(a)}</option>`).join('')}</select><div class="meters" style="margin-top:12px">${['rev','mx'].map(t=>`<div class="meter"><h3>${t.toUpperCase()} TIME</h3><label>FINISH</label><input inputmode="decimal" autocomplete="off" data-i="${i}" data-field="${t}Finish" value="${escape(f[t+'Finish'])}"><label>START</label><input inputmode="decimal" autocomplete="off" data-i="${i}" data-field="${t}Start" value="${escape(f[t+'Start'])}"><div class="time" id="total-${i}-${t}">${fmt(delta(f[t+'Start'],f[t+'Finish']))}</div></div>`).join('')}</div></article>`).join('');container.querySelectorAll('[data-field]').forEach(el=>{const i=+el.dataset.i,field=el.dataset.field;let composition=false,before='',voiceTimer;el.addEventListener('compositionstart',()=>{composition=true;before=el.value});el.addEventListener('compositionend',()=>{composition=false;const v=dedupe(el.value,before);el.value=v;flights[i][field]=v;draft();updateTotals()});el.addEventListener('input',()=>{if(composition)return;clearTimeout(voiceTimer);flights[i][field]=el.value;draft();updateTotals()});el.addEventListener('change',()=>{if(field==='aircraft'){flights[i][field]=el.value;draft();return}let v=dedupe(el.value,before);v=normalize(v);el.value=v;flights[i][field]=v;draft();updateTotals()});el.addEventListener('focus',()=>{before=el.value});el.addEventListener('blur',()=>{if(field==='aircraft')return;let v=normalize(dedupe(el.value,before));el.value=v;flights[i][field]=v;draft();updateTotals()})});container.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{if(confirm('Remove this unsaved flight?')){flights.splice(+el.dataset.remove,1);draft();render()}});updateTotals();renderHistory();renderTotals()};function updateTotals(){flights.forEach((f,i)=>['rev','mx'].forEach(t=>{const el=$(`#total-${i}-${t}`);if(el)el.textContent=fmt(delta(f[t+'Start'],f[t+'Finish']))}))};function save(){const good=flights.filter(f=>f.aircraft||['revStart','revFinish','mxStart','mxFinish'].some(k=>f[k]!==''));if(!good.length)return notify('Enter a flight first');for(const f of good){if(!f.aircraft||['revStart','revFinish','mxStart','mxFinish'].some(k=>f[k]===''))return notify('Complete aircraft and all REV/MX readings');if(val(f.revFinish)<val(f.revStart)||val(f.mxFinish)<val(f.mxStart))return notify('Finish readings must be at least start readings')}const day={id:Date.now()+'-'+Math.random().toString(36).slice(2),date,savedAt:new Date().toISOString(),flights:good.map((f,i)=>({...f,flightNumber:i+1,revTime:delta(f.revStart,f.revFinish),mxTime:delta(f.mxStart,f.mxFinish)}))};state.days.unshift(day);flights=[blank()];state.drafts[date]=flights;persist();render();notify('Saved to this device')};function renderHistory(){const el=$('#historyContent');if(!state.days.length){el.innerHTML='<p>No saved flights yet.</p>';return}el.innerHTML=state.days.map(day=>`<details class="history-day"><summary><span>${escape(day.date)}</span><span>REV ${fmt(day.flights.reduce((s,f)=>s+val(f.revTime),0))}</span></summary><p class="small">Saved ${new Date(day.savedAt).toLocaleString()} · Swipe left on a flight or use Remove</p>${day.flights.map((f,i)=>`<div class="saved-flight" data-day="${escape(day.id)}" data-flight="${i}"><div><strong>${escape(f.aircraft)}</strong><div class="small">REV ${fmt(f.revTime)} · MX ${fmt(f.mxTime)}</div></div><button class="danger" data-deleteflight="${i}" data-day="${escape(day.id)}">Remove</button></div>`).join('')}<div class="row"><span class="small">MX total ${fmt(day.flights.reduce((s,f)=>s+val(f.mxTime),0))}</span><button class="danger" data-deleteday="${escape(day.id)}">Delete day</button></div></details>`).join('');el.querySelectorAll('[data-deleteflight]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this saved flight?'))return;const d=state.days.find(x=>x.id===b.dataset.day);d.flights.splice(+b.dataset.deleteflight,1);if(!d.flights.length)state.days=state.days.filter(x=>x!==d);persist();renderHistory();renderTotals()});el.querySelectorAll('[data-deleteday]').forEach(b=>b.onclick=()=>{if(!confirm('Delete entire saved day?'))return;state.days=state.days.filter(x=>x.id!==b.dataset.deleteday);persist();renderHistory();renderTotals()});el.querySelectorAll('[data-flight]').forEach(el=>{let x=0;el.addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x-e.changedTouches[0].clientX>75){const b=el.querySelector('[data-deleteflight]');b.click()}},{passive:true})})};function renderTotals(){const from=$('#from').value,to=$('#to').value;const days=state.days.filter(d=>(!from||d.date>=from)&&(!to||d.date<=to));let rev=0,mx=0,n=0;days.forEach(d=>d.flights.forEach(f=>{rev+=val(f.revTime);mx+=val(f.mxTime);n++}));$('#totalsContent').innerHTML=`<div class="row"><strong>REV</strong><strong>${fmt(rev)}</strong></div><div class="row"><strong>MX</strong><strong>${fmt(mx)}</strong></div><p>${n} flights across ${days.length} saved sessions</p>`};$('#date').onchange=e=>switchDate(e.target.value);$('#add').onclick=()=>{const prev=flights[flights.length-1];const f=blank();if(prev?.aircraft){f.aircraft=prev.aircraft;f.revStart=prev.revFinish;f.mxStart=prev.mxFinish}flights.push(f);draft();render()};$('#save').onclick=save;$('#manage').onclick=()=>{const action=prompt('Type ADD to add aircraft or REMOVE to remove aircraft:','ADD');if(!action)return;const a=prompt('Aircraft ID (e.g. 62FM):');if(!a)return;const id=a.trim().toUpperCase();if(action.trim().toUpperCase()==='REMOVE'){if(!confirm('Remove '+id+' from the aircraft list?'))return;state.aircraft=state.aircraft.filter(x=>x!==id)}else if(!state.aircraft.includes(id))state.aircraft.push(id);state.aircraft.sort((a,b)=>parseInt(a)-parseInt(b));persist();render()};$('#settingsBtn').onclick=()=>document.body.classList.toggle('show-settings');$('#fast').checked=!!state.fast;$('#light').checked=!!state.light;document.body.classList.toggle('light',!!state.light);$('#fast').onchange=e=>{state.fast=e.target.checked;persist()};$('#light').onchange=e=>{state.light=e.target.checked;document.body.classList.toggle('light',state.light);persist()};$('#from').onchange=renderTotals;$('#to').onchange=renderTotals;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='top')window.scrollTo({top:0,behavior:'smooth'});else document.getElementById(b.dataset.go).scrollIntoView({behavior:'smooth'})});$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'pilot-daily-log-standalone-v1',data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flight-log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='pilot-daily-log-standalone-v1'||!obj.data?.days)throw Error('Wrong backup format');if(!confirm('Replace all data in this version with the backup?'))return;state=obj.data;persist();location.reload()}catch(err){alert('Could not import: '+err.message)}};$('#date').value=date;flights=(state.drafts[date]||[blank()]).map(f=>({...f}));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
